# Build and release this converter on GitHub-hosted runners.
#
# Triggered by the version tag that the WATS publishing pipeline pushes with each
# export (v<version>), or manually for an existing tag. Builds every target framework
# in the converter project, packages one ZIP per framework and attaches them to the
# release for that tag (created from CHANGELOG.md if it does not exist yet).
#
#   net472          -> WATS Client 6 (.NET Framework 4.7.2)
#   net8.0-windows  -> WATS Client 7 (.NET 8)
#
# Managed by the WATS converter repository; changes made here are overwritten on
# the next export.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build, for example v1.0.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Get-ChildItem -File -Filter *.csproj | Where-Object { $_.Name -notmatch 'Tests?\.csproj$' } | Select-Object -First 1
          if (-not $project) { throw 'No converter project (*.csproj) found in the repository root.' }

          function Get-Prop([string]$name, [string]$framework) {
            $extra = @('-p:Configuration=Release')
            if ($framework) { $extra += "-p:TargetFramework=$framework" }
            # A single -getProperty prints the plain value.
            return (dotnet msbuild $project.FullName "-getProperty:$name" @extra | Out-String).Trim()
          }

          $frameworks = (Get-Prop 'TargetFrameworks'); if (-not $frameworks) { $frameworks = Get-Prop 'TargetFramework' }
          $frameworks = $frameworks -split ';' | Where-Object { $_ }
          $version = $env:TAG -replace '^v', ''
          $name = '${{ github.event.repository.name }}'
          $hostProvided = '^(Virinco\.WATS|WATS\.Client|Newtonsoft\.Json|System\.|Microsoft\.|xunit|testhost)'
          New-Item -ItemType Directory -Force dist | Out-Null

          dotnet restore $project.FullName
          foreach ($fw in $frameworks) {
            Write-Host "::group::Build $fw"
            dotnet build $project.FullName -c Release -f $fw --no-restore -p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { throw "Build failed for $fw" }
            Write-Host '::endgroup::'

            $targetDir = Get-Prop 'TargetDir' $fw
            $assembly = Get-Prop 'AssemblyName' $fw
            $outputType = Get-Prop 'OutputType' $fw
            $stage = Join-Path $env:RUNNER_TEMP "pkg-$fw"
            New-Item -ItemType Directory -Force $stage | Out-Null

            if ($outputType -match 'Exe') {
              # Standalone application: ship the complete output folder.
              Copy-Item (Join-Path $targetDir '*') $stage -Recurse -Exclude '*.pdb'
            }
            else {
              # Converter library: ship the converter and its own dependencies; the WATS Client provides the rest.
              Get-ChildItem $targetDir -File -Filter *.dll |
                Where-Object { $_.BaseName -eq $assembly -or ($_.Name -notmatch $hostProvided -and $_.Name -notmatch 'Tests?\.dll$') } |
                Copy-Item -Destination $stage
            }
            foreach ($doc in 'README.md', 'CHANGELOG.md', 'LICENSE.md', 'LICENSE', 'LICENSE.txt') {
              if (Test-Path $doc) { Copy-Item $doc $stage }
            }
            $zip = "dist/$name-$version-$fw.zip"
            Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
            Write-Host "Packaged $zip"
          }

      - name: Publish release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $version = [regex]::Escape(($env:TAG -replace '^v', ''))
            $notes = "Release $env:TAG"
            if (Test-Path CHANGELOG.md) {
              $m = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?ms)^## \[$version(\.0)*\][^\n]*\n(.*?)(?=^## \[|\z)")
              if ($m.Success -and $m.Groups[2].Value.Trim()) { $notes = $m.Groups[2].Value.Trim() }
            }
            # Describe what was actually built — a converter ships net472/net8.0-windows,
            # a supporting tool may ship net48/net8.0. Naming frameworks that are not in
            # dist/ sends people looking for a download that does not exist.
            # The framework is the trailing net* part of the name; net8.0-windows itself contains a hyphen.
            $built = (Get-ChildItem dist/*.zip | ForEach-Object { [regex]::Match($_.BaseName, '(net\d[\w.]*(-windows[\d.]*)?)$').Value } | Sort-Object -Unique)
            $labels = $built | ForEach-Object {
              switch -Regex ($_) {
                '^net4'  { "``*-$_.zip`` for .NET Framework (WATS Client 6)"; break }
                default  { "``*-$_.zip`` for .NET 8 (WATS Client 7)" }
              }
            }
            $notes += "`n`n**Downloads:** " + ($labels -join ', ') + "."
            Set-Content -Path release-notes.md -Value $notes -Encoding utf8
            gh release create $env:TAG --title $env:TAG --notes-file release-notes.md --verify-tag
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release.' }
          }
          gh release upload $env:TAG (Get-ChildItem dist/*.zip).FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets.' }
